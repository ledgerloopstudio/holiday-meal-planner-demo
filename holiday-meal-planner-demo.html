<!DOCTYPE html>
<html lang="en" data-theme="cranberry" data-font="serif">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hearth &amp; Harvest · Holiday Meal Planner (Free Demo)</title>
<style>
/* ============ HEARTH & HARVEST IDENTITY · THEMES ============ */
:root{
  --r-sm:10px; --r-md:16px; --r-lg:22px;
  --shadow-1:0 1px 2px rgba(58,34,38,.06);
  --shadow-2:0 1px 2px rgba(58,34,38,.05),0 10px 28px -8px rgba(58,34,38,.14);
  --shadow-3:0 2px 6px rgba(58,34,38,.08),0 18px 44px -12px rgba(58,34,38,.20);
}
/* Cranberry & Gold — light default */
[data-theme="cranberry"]{
  --bg:#FBF6EF; --bg-soft:#F5EDDF; --card:#FFFFFF; --card-soft:#FDFAF4;
  --ink:#3A2226; --ink-soft:#7A5C5C; --ink-faint:#A88F86;
  --line:#EAD9C6; --line-soft:#F2E6D4;
  --accent:#8E2434; --accent-deep:#6E1A27; --accent-soft:#F5DEDD; --accent-ghost:#FAEFEF;
  --gold:#B98A1F; --gold-deep:#8F6A15; --gold-soft:#F7ECD2; --gold-ghost:#FCF6E7;
  --good:#5E8F6A; --good-soft:#E3EFE4; --warn:#C08A2D; --warn-soft:#F7ECD4; --bad:#C05B5B; --bad-soft:#F7DEDE;
  --input-bg:#FDFAF4; --shadow-color:58,34,38;
}
/* Forest Elegance */
[data-theme="forest"]{
  --bg:#F4F7F1; --bg-soft:#E8EFE2; --card:#FFFFFF; --card-soft:#FAFCF8;
  --ink:#1F2E24; --ink-soft:#5B6E5F; --ink-faint:#8B9A8D;
  --line:#D6E2CC; --line-soft:#E4ECDC;
  --accent:#2E5B3F; --accent-deep:#1E4229; --accent-soft:#DDEBD9; --accent-ghost:#EFF5EC;
  --gold:#A8842C; --gold-deep:#7E6420; --gold-soft:#F3E8CC; --gold-ghost:#FAF4E2;
  --good:#4E7D58; --good-soft:#DDEBD9; --warn:#B07E24; --warn-soft:#F5E9CB; --bad:#B05353; --bad-soft:#F5DADA;
  --input-bg:#FAFCF8; --shadow-color:31,46,36;
}
/* Winter White */
[data-theme="winter"]{
  --bg:#F5F8FB; --bg-soft:#E9F0F6; --card:#FFFFFF; --card-soft:#F9FCFE;
  --ink:#243244; --ink-soft:#5C6E84; --ink-faint:#8E9FB2;
  --line:#D8E2EC; --line-soft:#E6EDF4;
  --accent:#3E6B8E; --accent-deep:#2C4F6B; --accent-soft:#DCE8F2; --accent-ghost:#EDF3F9;
  --gold:#A8842C; --gold-deep:#7E6420; --gold-soft:#F3E8CC; --gold-ghost:#FAF4E2;
  --good:#5E8F6A; --good-soft:#E3EFE4; --warn:#C08A2D; --warn-soft:#F7ECD4; --bad:#C05B5B; --bad-soft:#F7DEDE;
  --input-bg:#F9FCFE; --shadow-color:36,50,68;
}
/* Midnight Feast — dark */
[data-theme="midnight"]{
  --bg:#171216; --bg-soft:#1F181D; --card:#241B21; --card-soft:#2A2027;
  --ink:#F2E8DC; --ink-soft:#C2AC9C; --ink-faint:#8D7668;
  --line:#3D2E35; --line-soft:#32262D;
  --accent:#D4717F; --accent-deep:#E89AA4; --accent-soft:#4A2730; --accent-ghost:#382028;
  --gold:#D4A94E; --gold-deep:#E5BE6B; --gold-soft:#4A3A1C; --gold-ghost:#3A2E16;
  --good:#8FC79B; --good-soft:#2C4633; --warn:#D9A94F; --warn-soft:#4A3A1E; --bad:#DE8484; --bad-soft:#4E2A2A;
  --input-bg:#1F181D; --shadow-color:0,0,0;
}
/* ============ FONTS ============ */
[data-font="serif"]{ --font-body:Georgia,'Times New Roman',serif; --font-display:Georgia,'Times New Roman',serif; }
[data-font="sans"]{ --font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif; --font-display:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif; }
[data-font="elegant"]{ --font-body:'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif; --font-display:'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif; }
/* ============ BASE ============ */
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html{scroll-behavior:smooth;}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--font-body); font-size:15px; line-height:1.55;
  transition:background .35s ease,color .35s ease;
}
::selection{background:var(--accent-soft);}
h1,h2,h3,h4{font-family:var(--font-display); margin:0; font-weight:650; letter-spacing:-.01em;}
p{margin:0 0 .8em;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit; font-size:14px; color:var(--ink); background:var(--input-bg); border:1px solid var(--line); border-radius:var(--r-sm); padding:10px 12px; width:100%; transition:border-color .2s, box-shadow .2s;}
input:focus,select:focus,textarea:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);}
input[type="checkbox"]{width:auto; accent-color:var(--accent);}
label{font-size:12px; font-weight:600; color:var(--ink-soft); display:block; margin-bottom:6px; letter-spacing:.02em;}
/* ============ LAYOUT ============ */
.shell{max-width:1180px; margin:0 auto; padding:0 22px 90px;}
.topbar{position:sticky; top:0; z-index:50; backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); background:color-mix(in srgb, var(--bg) 82%, transparent); border-bottom:1px solid var(--line-soft);}
.topbar-inner{max-width:1180px; margin:0 auto; padding:12px 22px; display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
.brand{display:flex; align-items:center; gap:12px; margin-right:auto;}
.brand-mark{width:42px; height:42px; border-radius:14px; background:linear-gradient(135deg,var(--accent),var(--accent-deep)); display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow-1); flex:none;}
.brand-mark svg{width:23px; height:23px; stroke:#FFF; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round;}
.brand-name{font-family:var(--font-display); font-size:19px; font-weight:700; letter-spacing:-.01em;}
.brand-sub{font-size:10.5px; color:var(--ink-faint); letter-spacing:.16em; text-transform:uppercase; font-weight:600;}
.dock{display:flex; gap:6px; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:5px; box-shadow:var(--shadow-1); align-items:center;}
.theme-dot{width:28px; height:28px; border-radius:50%; border:2px solid transparent; cursor:pointer; position:relative; transition:transform .18s; padding:0;}
.theme-dot:hover{transform:scale(1.12);}
.theme-dot.active{border-color:var(--ink);}
.theme-dot[data-set-theme="cranberry"]{background:linear-gradient(135deg,#FBF6EF 50%,#8E2434 50%);}
.theme-dot[data-set-theme="forest"]{background:linear-gradient(135deg,#F4F7F1 50%,#2E5B3F 50%);}
.theme-dot[data-set-theme="winter"]{background:linear-gradient(135deg,#F5F8FB 50%,#3E6B8E 50%);}
.theme-dot[data-set-theme="midnight"]{background:linear-gradient(135deg,#241B21 50%,#D4A94E 50%);}
.font-dock button{border:none; background:transparent; color:var(--ink-soft); font-size:12px; font-weight:700; padding:7px 11px; border-radius:999px;}
.font-dock button.active{background:var(--accent-soft); color:var(--accent-deep);}
.mode-btn{border:none; background:transparent; color:var(--ink-soft); font-size:12px; font-weight:700; padding:7px 11px; border-radius:999px; display:flex; align-items:center; gap:6px;}
.mode-btn svg{width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round;}
/* ============ NAV ============ */
.nav{display:flex; gap:6px; overflow-x:auto; padding:18px 0 4px; scrollbar-width:none;}
.nav::-webkit-scrollbar{display:none;}
.nav-btn{flex:none; border:1px solid var(--line); background:var(--card); color:var(--ink-soft); border-radius:999px; padding:10px 18px; font-size:13.5px; font-weight:600; display:flex; align-items:center; gap:8px; transition:all .22s; box-shadow:var(--shadow-1);}
.nav-btn svg{width:16px; height:16px; opacity:.75; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round;}
.nav-btn:hover{transform:translateY(-1px); box-shadow:var(--shadow-2);}
.nav-btn.active{background:var(--ink); color:var(--bg); border-color:var(--ink);}
.nav-btn.active svg{opacity:1;}
/* ============ CARDS / GRID ============ */
.view{display:none; animation:fadeUp .35s ease;}
.view.active{display:block;}
@keyframes fadeUp{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;}}
.page-head{margin:26px 0 18px;}
.page-head h2{font-size:30px; letter-spacing:-.02em;}
.page-head p{color:var(--ink-soft); margin:.4em 0 0; font-size:14.5px;}
.grid{display:grid; gap:14px;}
.grid.cols-2{grid-template-columns:repeat(2,minmax(0,1fr));}
.grid.cols-3{grid-template-columns:repeat(3,minmax(0,1fr));}
.grid.cols-4{grid-template-columns:repeat(4,minmax(0,1fr));}
@media(max-width:900px){.grid.cols-4{grid-template-columns:repeat(2,minmax(0,1fr));} .grid.cols-3{grid-template-columns:repeat(2,minmax(0,1fr));}}
@media(max-width:620px){.grid.cols-2,.grid.cols-3,.grid.cols-4{grid-template-columns:1fr;}}
.card{background:var(--card); border:1px solid var(--line-soft); border-radius:var(--r-lg); padding:20px; box-shadow:var(--shadow-1); transition:transform .2s, box-shadow .2s;}
.card.hoverable:hover{transform:translateY(-2px); box-shadow:var(--shadow-2);}
.card h3{font-size:17px; margin-bottom:4px;}
.card .sub{font-size:13px; color:var(--ink-soft);}
.stat-num{font-family:var(--font-display); font-size:34px; font-weight:700; letter-spacing:-.02em; line-height:1.1;}
.stat-label{font-size:12px; color:var(--ink-soft); font-weight:600; letter-spacing:.06em; text-transform:uppercase; margin-top:6px;}
.stat-card{position:relative; overflow:hidden;}
.stat-card::after{content:""; position:absolute; top:0; left:0; right:0; height:3px; background:linear-gradient(90deg,var(--accent),var(--gold)); opacity:.85;}
.countdown-hero{background:linear-gradient(135deg,var(--accent-deep),var(--accent) 55%,var(--gold-deep)); color:#FFF; border:none; position:relative; overflow:hidden;}
.countdown-hero::before{content:""; position:absolute; inset:0; background:radial-gradient(600px 200px at 85% -20%, rgba(255,255,255,.22), transparent 60%); pointer-events:none;}
.countdown-hero h3,.countdown-hero .sub{color:rgba(255,255,255,.92);}
.countdown-big{font-family:var(--font-display); font-size:52px; font-weight:700; letter-spacing:-.03em; line-height:1;}
.countdown-big small{font-size:16px; font-weight:500; letter-spacing:.08em;}
/* ============ BUTTONS ============ */
.btn{display:inline-flex; align-items:center; gap:8px; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:999px; padding:10px 20px; font-size:13.5px; font-weight:650; transition:all .2s; box-shadow:var(--shadow-1);}
.btn svg{width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round;}
.btn:hover{transform:translateY(-1px); box-shadow:var(--shadow-2);}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-deep)); color:#FFF; border:none;}
.btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold-deep)); color:#FFF; border:none;}
.btn.ghost{background:transparent; box-shadow:none;}
.btn.small{padding:7px 14px; font-size:12.5px;}
.btn.danger{color:var(--bad); border-color:var(--bad);}
.icon-btn{border:1px solid var(--line); background:var(--card); border-radius:10px; width:34px; height:34px; display:inline-flex; align-items:center; justify-content:center; color:var(--ink-soft); transition:all .18s; flex:none;}
.icon-btn svg{width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;}
.icon-btn:hover{color:var(--accent); border-color:var(--accent);}
.icon-btn.danger:hover{color:var(--bad); border-color:var(--bad);}
.toolbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:0 0 16px;}
.toolbar .spacer{flex:1;}
/* ============ LISTS / TABLES ============ */
.row-item{display:flex; align-items:center; gap:12px; padding:13px 4px; border-bottom:1px solid var(--line-soft);}
.row-item:last-child{border-bottom:none;}
.row-main{flex:1; min-width:0;}
.row-title{font-weight:650; font-size:14.5px;}
.row-meta{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}
.pill{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; letter-spacing:.03em; padding:4px 11px; border-radius:999px; white-space:nowrap;}
.pill.accent{background:var(--accent-soft); color:var(--accent-deep);}
.pill.gold{background:var(--gold-soft); color:var(--gold-deep);}
.pill.good{background:var(--good-soft); color:var(--good);}
.pill.warn{background:var(--warn-soft); color:var(--warn);}
.pill.bad{background:var(--bad-soft); color:var(--bad);}
.pill.neutral{background:var(--bg-soft); color:var(--ink-soft);}
.progress{height:8px; background:var(--bg-soft); border-radius:999px; overflow:hidden;}
.progress > i{display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--gold)); border-radius:999px; transition:width .5s ease;}
.progress.good > i{background:var(--good);}
.empty{text-align:center; padding:38px 18px; color:var(--ink-faint); font-size:14px;}
.empty svg{width:38px; height:38px; stroke:currentColor; fill:none; stroke-width:1.4; margin-bottom:10px; opacity:.6;}
/* ============ MODAL ============ */
.modal-back{position:fixed; inset:0; background:rgba(20,10,12,.5); backdrop-filter:blur(4px); z-index:100; display:none; align-items:flex-start; justify-content:center; padding:40px 18px; overflow-y:auto;}
.modal-back.open{display:flex; animation:fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
.modal{background:var(--card); border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--shadow-3); width:100%; max-width:560px; padding:26px; animation:fadeUp .3s ease;}
.modal.wide{max-width:720px;}
.modal h3{font-size:20px; margin-bottom:4px;}
.modal .m-sub{font-size:13px; color:var(--ink-soft); margin-bottom:18px;}
.field{margin-bottom:14px;}
.field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
@media(max-width:520px){.field-row{grid-template-columns:1fr;}}
.modal-actions{display:flex; gap:10px; justify-content:flex-end; margin-top:20px; flex-wrap:wrap;}
.ing-row{display:grid; grid-template-columns:1fr 90px 110px 130px 36px; gap:8px; margin-bottom:8px; align-items:center;}
@media(max-width:560px){.ing-row{grid-template-columns:1fr 70px 36px;} .ing-row .hide-sm{display:none;}}
.step-row{display:flex; gap:10px; margin-bottom:8px; align-items:flex-start;}
.step-num{flex:none; width:30px; height:30px; border-radius:50%; background:var(--accent-soft); color:var(--accent-deep); font-weight:700; font-size:13px; display:flex; align-items:center; justify-content:center; margin-top:6px;}
/* ============ TIMELINE ============ */
.tl{position:relative; padding-left:26px;}
.tl::before{content:""; position:absolute; left:8px; top:8px; bottom:8px; width:2px; background:linear-gradient(var(--accent),var(--gold)); border-radius:2px; opacity:.5;}
.tl-item{position:relative; padding:0 0 18px;}
.tl-item::before{content:""; position:absolute; left:-24px; top:5px; width:12px; height:12px; border-radius:50%; background:var(--card); border:3px solid var(--accent);}
.tl-item.done::before{background:var(--good); border-color:var(--good);}
.tl-item.done .tl-title{text-decoration:line-through; color:var(--ink-faint);}
.tl-time{font-size:12px; font-weight:700; color:var(--accent-deep); letter-spacing:.04em; text-transform:uppercase;}
.tl-title{font-weight:650; font-size:14.5px; margin:2px 0;}
.tl-meta{font-size:12.5px; color:var(--ink-soft);}
/* ============ MISC ============ */
.divider{height:1px; background:var(--line-soft); margin:16px 0;}
.section-title{font-size:13px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft); margin:22px 0 12px; display:flex; align-items:center; gap:10px;}
.section-title::after{content:""; flex:1; height:1px; background:var(--line-soft);}
.check-line{display:flex; align-items:flex-start; gap:10px; padding:9px 4px; border-bottom:1px solid var(--line-soft); font-size:14px;}
.check-line:last-child{border-bottom:none;}
.check-line input{margin-top:3px; width:17px; height:17px; flex:none;}
.check-line.done span{color:var(--ink-faint); text-decoration:line-through;}
.alert-strip{display:flex; gap:10px; align-items:flex-start; background:var(--warn-soft); border:1px solid var(--warn); border-radius:var(--r-md); padding:12px 16px; font-size:13.5px; margin-bottom:14px;}
.alert-strip svg{width:17px; height:17px; flex:none; stroke:var(--warn); fill:none; stroke-width:1.8; margin-top:2px;}
.kbd-hint{font-size:11.5px; color:var(--ink-faint);}
.toast{position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--bg); padding:12px 22px; border-radius:999px; font-size:13.5px; font-weight:600; opacity:0; transition:all .3s; z-index:200; pointer-events:none; box-shadow:var(--shadow-3);}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
footer.app-foot{text-align:center; color:var(--ink-faint); font-size:12px; padding:30px 0 10px; letter-spacing:.04em;}
@media print{.topbar,.nav,.toolbar,.modal-back,.toast{display:none !important;} .view{display:block !important;}}
</style>
</head>

<script>
"use strict";
/* ================================================================
   HEARTH & HARVEST — Holiday Meal Planner
   Offline single-file app. All state in localStorage.

function load(){

}
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} }
function resetDemo(){ S = sampleData(); save(); applyThemeFont(); render(); toast("Demo data restored"); }

/* ================= THEME / FONT / MODE ================= */
function applyThemeFont(){
  document.documentElement.setAttribute("data-theme", S.settings.theme||"cranberry");
  document.documentElement.setAttribute("data-font", S.settings.font||"serif");
  $$(".theme-dot").forEach(b => b.classList.toggle("active", b.dataset.setTheme === S.settings.theme));
  $$(".font-dock button").forEach(b => b.classList.toggle("active", b.dataset.setFont === S.settings.font));
  const dark = S.settings.theme === "midnight";
  $("#modeLabel").textContent = dark ? "Light" : "Dark";
}
function setTheme(t){ S.settings.theme = t; save(); applyThemeFont(); }
function setFont(f){ S.settings.font = f; save(); applyThemeFont(); }
function toggleMode(){ setTheme(S.settings.theme === "midnight" ? "cranberry" : "midnight"); }

/* ================= HELPERS ================= */
let toastTimer;
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove("show"), 2400);
}
function openModal(html, wide){
  const box = $("#modalBox"); box.className = "modal" + (wide ? " wide" : "");
  box.innerHTML = html; $("#modalBack").classList.add("open");
}
function closeModal(){ $("#modalBack").classList.remove("open"); }
$("#modalBack").addEventListener("click", e => { if(e.target.id === "modalBack") closeModal(); });
document.addEventListener("keydown", e => { if(e.key === "Escape") closeModal(); });

function fmtDate(iso){
  if(!iso) return "";
  const d = new Date(iso + (iso.length===10 ? "T12:00:00" : ""));
  return d.toLocaleDateString(undefined,{weekday:"short", month:"short", day:"numeric"});
}
function fmtTime(iso){
  if(!iso || iso.length<=10) return "";
  const d = new Date(iso);
  return d.toLocaleTimeString(undefined,{hour:"numeric", minute:"2-digit"});
}
function fmtDateTime(iso){
  if(!iso) return "";
  const hasTime = iso.length > 10;
  return fmtDate(iso.slice(0,10)) + (hasTime ? " · " + fmtTime(iso) : "");
}
function daysUntil(dateStr){
  const now = new Date(); now.setHours(0,0,0,0);
  const d = new Date(dateStr + "T12:00:00");
  return Math.floor((d - now)/86400000);
}
function confirmedHeadcount(){
  return S.guests.filter(g=>g.rsvp==="Confirmed").reduce((a,g)=>a+(+g.adults||0)+(+g.kids||0),0);
}
function allDiets(){
  const m = {};
  S.guests.forEach(g => (g.diets||[]).forEach(d => { m[d]=(m[d]||0)+1; }));
  return m;
}
function totalSpent(){ return S.expenses.reduce((a,e)=>a+(+e.amount||0),0); }

/* ---- grocery consolidation ---- */
function consolidatedGrocery(){
  const map = new Map();
  S.dishes.forEach(d => (d.ingredients||[]).forEach(ing => {
    const key = "auto|" + ing.name.trim().toLowerCase() + "|" + (ing.unit||"").trim().toLowerCase();
    if(!map.has(key)) map.set(key, {key, name:ing.name.trim(), qty:Number(ing.qty)||0, unit:(ing.unit||"").trim(), section:ing.section||"Other", auto:true, from:[d.name]});
    else { const e = map.get(key); e.qty += Number(ing.qty)||0; if(!e.from.includes(d.name)) e.from.push(d.name); }
  }));
  S.groceryManual.forEach(m => {
    map.set("man|"+m.id, {key:"man|"+m.id, name:m.name, qty:Number(m.qty)||0, unit:m.unit||"", section:m.section||"Other", auto:false, manId:m.id});
  });
  return Array.from(map.values());
}
function groceryStats(){
  const items = consolidatedGrocery();
  const done = items.filter(i => S.groceryChecked[i.key]).length;
  return {total:items.length, done, pct: items.length ? Math.round(done/items.length*100) : 0};
}
function dishById(id){ return S.dishes.find(d=>d.id===id); }

<script>

/* ================= NAV ================= */
let currentView = "dashboard";
function renderNav(){
  $("#mainNav").innerHTML = NAV.map(([id,label,icon]) =>

  ).join("");

}
function go(id){
  currentView = id;
  $$(".view").forEach(v => v.classList.remove("active"));
  $("#view-"+id).classList.add("active");
  renderNav();
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

function rsvpPill(r){
  const cls = r==="Confirmed"?"good":(r==="Declined"?"bad":"warn");

        <div class="sub" style="margin-top:8px;">${fmtDate(S.settings.holidayDate)}</div>
      </div>
      <div class="card stat-card"><div class="stat-num">${confirmedHeadcount()}</div><div class="stat-label">Confirmed guests</div><div class="sub" style="margin-top:8px;">${S.guests.length} parties on the list</div></div>

    </div>
    <div class="grid cols-2">
      <div class="card">
        <h3>Grocery progress</h3><div class="sub">${gs.done} of ${gs.total} items checked off</div>
        <div class="progress" style="margin:12px 0 6px;"><i style="width:${gs.pct}%"></i></div>
        <div class="sub">${gs.pct}% complete</div>
        <div style="margin-top:12px;"><button class="btn small" data-go="grocery">${ICONS.grocery} Open grocery list</button></div>
      </div>

        <h3>Budget snapshot</h3><div class="sub">${money(spent)} of ${money(budget)} planned</div>
        <div class="progress${bPct>90?"":" good"}" style="margin:12px 0 6px;"><i style="width:${bPct}%"></i></div>
        <div class="sub">${bPct}% of budget used</div>
        <div style="margin-top:12px;"><button class="btn small" data-go="budget">${ICONS.budget} Open budget</button></div>

        <h3>Up next</h3><div class="sub">Your next timeline tasks</div><div class="divider"></div>

          <div class="row-item"><div class="row-main">
            <div class="row-title">${esc(t.title)}</div>
            <div class="row-meta">${fmtDateTime(t.datetime)}</div>

      </div>

        <h3>Dietary needs</h3><div class="sub">Across confirmed guests</div><div class="divider"></div>
        ${dietList.length ? dietList.map(([d,n])=>`
          <div class="row-item"><div class="row-main"><div class="row-title">${esc(d)}</div></div>
          <span class="pill warn">${n} guest${n>1?"s":""}</span></div>`).join("")

      </div>
    </div>`;

function dishModal(id, presetCourse){
  const d = id ? dishById(id) : {name:"", course:presetCourse||"Mains", servings:8, cook:"", notes:"", ingredients:[]};
  const ings = (d.ingredients||[]).map(i=>({...i}));
  openModal(`
    <h3>${id?"Edit dish":"Add dish"}</h3><div class="m-sub">Dishes power the grocery list, recipes and timeline.</div>
    <div class="field-row">
      <div class="field"><label>Dish name</label><input id="f-name" value="${esc(d.name)}" placeholder="e.g. Honey-Glazed Ham"></div>
      <div class="field"><label>Course</label><select id="f-course">${COURSES.map(c=>`<option${c===d.course?" selected":""}>${c}</option>`).join("")}</select></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Servings</label><input id="f-serv" type="number" min="1" value="${esc(d.servings)}"></div>
      <div class="field"><label>Assigned cook</label><input id="f-cook" value="${esc(d.cook)}" placeholder="Who's making it?"></div>
    </div>
    <div class="field"><label>Notes</label><input id="f-notes" value="${esc(d.notes)}" placeholder="Optional tip"></div>
    <div class="section-title">Ingredients</div>
    <div id="ingList"></div>
    <button class="btn small" id="addIng">${ICONS.plus} Add ingredient</button>
    <div class="modal-actions">
      <button class="btn ghost" id="mCancel">Cancel</button>
      <button class="btn primary" id="mSave">${ICONS.check} Save dish</button>
    </div>`, true);
  const list = $("#ingList");
  function drawIngs(){
    list.innerHTML = ings.map((g,i)=>`
      <div class="ing-row">
        <input data-i="${i}" data-k="name" value="${esc(g.name)}" placeholder="Ingredient">
        <input data-i="${i}" data-k="qty" type="number" step="any" min="0" value="${esc(g.qty)}" placeholder="Qty">
        <input data-i="${i}" data-k="unit" value="${esc(g.unit)}" placeholder="Unit" class="hide-sm">
        <select data-i="${i}" data-k="section" class="hide-sm">${SECTIONS.map(s=>`<option${s===g.section?" selected":""}>${s}</option>`).join("")}</select>
        <button class="icon-btn danger" data-del-ing="${i}">${ICONS.x}</button>
      </div>`).join("");
    $$("input,select", list).forEach(inp=>inp.addEventListener("input",()=>{
      ings[+inp.dataset.i][inp.dataset.k] = inp.dataset.k==="qty" ? (+inp.value||0) : inp.value;
    }));
    $$("[data-del-ing]", list).forEach(b=>b.addEventListener("click",()=>{ ings.splice(+b.dataset.delIng,1); drawIngs(); }));
  }
  drawIngs();
  $("#addIng").addEventListener("click",()=>{ ings.push({name:"",qty:0,unit:"",section:"Produce"}); drawIngs(); });
  $("#mCancel").addEventListener("click", closeModal);
  $("#mSave").addEventListener("click",()=>{
    const name = $("#f-name").value.trim();
    if(!name){ toast("Give the dish a name"); return; }
    const clean = ings.filter(g=>g.name.trim()).map(g=>({name:g.name.trim(), qty:+g.qty||0, unit:g.unit.trim(), section:g.section}));
    const obj = {id: id||uid(), name, course:$("#f-course").value, servings:+$("#f-serv").value||8, cook:$("#f-cook").value.trim(), notes:$("#f-notes").value.trim(), ingredients:clean};
    if(id){ const ix = S.dishes.findIndex(x=>x.id===id); S.dishes[ix]=obj; } else S.dishes.push(obj);
    save(); closeModal(); render(); toast("Dish saved — grocery list updated");
  });
}
</script>

<script>

let currentRecipeDish = null;
RENDER.recipes = function(){
  const el = $("#view-recipes");

  const withoutR = S.dishes.filter(d=>!S.recipes[d.id]);
  const sel = currentRecipeDish && dishById(currentRecipeDish) ? currentRecipeDish : (withR[0]&&withR[0].id);

  const r = sel ? S.recipes[sel] : null;
  const d = sel ? dishById(sel) : null;
  el.innerHTML = `
    <div class="page-head"><h2>Recipe Cards</h2><p>Ingredients, steps and timings for every dish — all in one place on cooking day.</p></div>
    <div class="toolbar"><span class="kbd-hint">Select a dish:</span>
      <select id="recipeSel" style="max-width:320px;">
        ${S.dishes.map(x=>`<option value="${x.id}"${x.id===sel?" selected":""}>${esc(x.name)}${S.recipes[x.id]?"":" (no recipe)"}</option>`).join("")}

      ${d?`<button class="btn" id="editRecipe">${ICONS.edit} ${r?"Edit recipe":"Add recipe"}</button>`:""}

      <div class="card stat-card"><div class="stat-num">${r.cookMin||0}<span style="font-size:16px;"> min</span></div><div class="stat-label">Cook time</div></div>
      <div class="card stat-card"><div class="stat-num">${r.servings||d.servings}</div><div class="stat-label">Servings</div></div>
    </div>
    <div class="grid cols-2">
      <div class="card"><h3>Ingredients</h3><div class="divider"></div>
        ${(r.ingredients||[]).map(i=>`<div class="check-line"><span><strong>${esc(i.name)}</strong>${i.qty?` — ${esc(i.qty)}`:""}</span></div>`).join("")||`<div class="empty">No ingredients listed.</div>`}
      </div>

        ${r.notes?`<div class="alert-strip" style="margin-top:14px;">${ICONS.alert}<span>${esc(r.notes)}</span></div>`:""}
      </div>
    </div>` : `
    <div class="card"><div class="empty">${ICONS.recipes}<br><strong>${esc(d.name)}</strong> has no recipe card yet.<br><br><button class="btn primary" id="editRecipe2">${ICONS.plus} Add recipe</button></div></div>`)
    : `<div class="card"><div class="empty">${ICONS.recipes}<br>Add a dish in the Menu first.</div></div>`}
    ${withoutR.length?`<div class="section-title">Dishes without recipes</div>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">${withoutR.map(x=>`<button class="btn small" data-mk-recipe="${x.id}">+ ${esc(x.name)}</button>`).join("")}</div>`:""}`;
  const sel2 = $("#recipeSel");
  if(sel2) sel2.addEventListener("change",()=>{ currentRecipeDish = sel2.value; render(); });
  const er = $("#editRecipe"); if(er) er.addEventListener("click",()=>recipeModal(sel));
  const er2 = $("#editRecipe2"); if(er2) er2.addEventListener("click",()=>recipeModal(sel));
  $$("[data-mk-recipe]", el).forEach(b=>b.addEventListener("click",()=>{ currentRecipeDish=b.dataset.mkRecipe; render(); setTimeout(()=>recipeModal(currentRecipeDish),80); }));

function recipeModal(dishId){
  const d = dishById(dishId); if(!d) return;
  const r = S.recipes[dishId] || {prepMin:20, cookMin:30, servings:d.servings||8, ingredients:(d.ingredients||[]).map(i=>({name:i.name, qty:(([i.qty,i.unit].filter(Boolean)).join(" "))})), steps:[], notes:""};
  const ings = (r.ingredients||[]).map(i=>({...i}));
  const steps = (r.steps||[]).slice();
  openModal(`
    <h3>Recipe — ${esc(d.name)}</h3><div class="m-sub">Timings feed the cooking timeline's auto-scheduler.</div>
    <div class="field-row">
      <div class="field"><label>Prep (min)</label><input id="r-prep" type="number" min="0" value="${esc(r.prepMin)}"></div>

    </div>
    <div class="field"><label>Servings</label><input id="r-serv" type="number" min="1" value="${esc(r.servings)}"></div>
    <div class="section-title">Ingredients</div><div id="rIngList"></div>
    <button class="btn small" id="rAddIng">${ICONS.plus} Add ingredient</button>
    <div class="section-title">Steps</div><div id="rStepList"></div>
    <button class="btn small" id="rAddStep">${ICONS.plus} Add step</button>
    <div class="field" style="margin-top:14px;"><label>Chef's notes</label><input id="r-notes" value="${esc(r.notes)}"></div>
    <div class="modal-actions"><button class="btn ghost" id="mCancel">Cancel</button><button class="btn primary" id="mSave">${ICONS.check} Save recipe</button></div>`, true);
  const il=$("#rIngList"), sl=$("#rStepList");
  function dI(){ il.innerHTML=ings.map((g,i)=>`<div class="ing-row" style="grid-template-columns:1fr 1fr 36px;"><input data-i="${i}" data-k="name" value="${esc(g.name)}" placeholder="Ingredient"><input data-i="${i}" data-k="qty" value="${esc(g.qty)}" placeholder="Qty"><button class="icon-btn danger" data-d="${i}">${ICONS.x}</button></div>`).join("");
    $$("input",il).forEach(x=>x.addEventListener("input",()=>{ings[+x.dataset.i][x.dataset.k]=x.value;}));
    $$("[data-d]",il).forEach(b=>b.addEventListener("click",()=>{ings.splice(+b.dataset.d,1);dI();})); }
  function dS(){ sl.innerHTML=steps.map((s,i)=>`<div class="step-row"><div class="step-num">${i+1}</div><textarea data-s="${i}" rows="2" style="flex:1;">${esc(s)}</textarea><button class="icon-btn danger" data-ds="${i}">${ICONS.x}</button></div>`).join("");
    $$("textarea",sl).forEach(x=>x.addEventListener("input",()=>{steps[+x.dataset.s]=x.value;}));
    $$("[data-ds]",sl).forEach(b=>b.addEventListener("click",()=>{steps.splice(+b.dataset.ds,1);dS();})); }
  dI(); dS();
  $("#rAddIng").addEventListener("click",()=>{ings.push({name:"",qty:""});dI();});
  $("#rAddStep").addEventListener("click",()=>{steps.push("");dS();});
  $("#mCancel").addEventListener("click",closeModal);
  $("#mSave").addEventListener("click",()=>{
    S.recipes[dishId]={prepMin:+$("#r-prep").value||0, cookMin:+$("#r-cook").value||0, servings:+$("#r-serv").value||d.servings||8,
      ingredients:ings.filter(g=>g.name.trim()), steps:steps.map(s=>s.trim()).filter(Boolean), notes:$("#r-notes").value.trim()};
    save(); closeModal(); render(); toast("Recipe saved");
  });
}

  return S.settings.holidayDate + "T" + (S.settings.servingTime||"18:00");
}
RENDER.timeline = function(){
  const el = $("#view-timeline");
  const tasks = S.tasks.slice().sort((a,b)=>a.datetime.localeCompare(b.datetime));
  const byDay = {};

  el.innerHTML = `

    <div class="toolbar">
      <button class="btn primary" id="addTask">${ICONS.plus} Add task</button>
      <button class="btn gold" id="autoSched">${ICONS.wand} Auto-build from menu</button>
    </div>
    ${Object.keys(byDay).sort().map(day=>`
      <div class="section-title">${fmtDate(day)}</div>
      <div class="card"><div class="tl">
        ${byDay[day].map(t=>`
          <div class="tl-item${t.done?" done":""}">
            <div class="tl-time">${fmtTime(t.datetime)||"All day"}</div>
            <div class="tl-title">${esc(t.title)}</div>
            ${t.notes?`<div class="tl-meta">${esc(t.notes)}</div>`:""}
            <div style="margin-top:8px; display:flex; gap:8px;">
              ${t.done?`<span class="pill good">Done</span>`:`<button class="btn small" data-tdone="${t.id}">${ICONS.check} Done</button>`}
              <button class="icon-btn" data-tedit="${t.id}" title="Edit">${ICONS.edit}</button>
              <button class="icon-btn danger" data-tdel="${t.id}" title="Delete">${ICONS.trash}</button>
            </div>
          </div>`).join("")}
      </div></div>`).join("") || `<div class="card"><div class="empty">${ICONS.timeline}<br>No tasks yet — add one or auto-build from your menu.</div></div>`}`;
  $("#addTask").addEventListener("click",()=>taskModal());
  $$("[data-tdone]",el).forEach(b=>b.addEventListener("click",()=>{S.tasks.find(t=>t.id===b.dataset.tdone).done=true;save();render();toast("Task done");}));
  $$("[data-tedit]",el).forEach(b=>b.addEventListener("click",()=>taskModal(b.dataset.tedit)));
  $$("[data-tdel]",el).forEach(b=>b.addEventListener("click",()=>{if(confirm("Delete this task?")){S.tasks=S.tasks.filter(t=>t.id!==b.dataset.tdel);save();render();}}));
  $("#autoSched").addEventListener("click",()=>{
    const serve = new Date(servingDateTime());
    let added = 0;
    S.dishes.forEach(d=>{
      const r = S.recipes[d.id]; if(!r) return;
      const total = (+r.prepMin||0)+(+r.cookMin||0); if(!total) return;
      const start = new Date(serve.getTime() - total*60000 - 30*60000);
      const iso = start.toISOString().slice(0,16);
      if(!S.tasks.some(t=>t.dishId===d.id && t.kind==="cook")){
        S.tasks.push({id:uid(), title:"Cook: "+d.name, datetime:iso, kind:"cook", dishId:d.id, done:false, notes:`${r.prepMin||0} min prep + ${r.cookMin||0} min cook · 30 min buffer before serving`});
        added++;
      }
    });
    save(); render();
    toast(added ? `Added ${added} cooking tasks` : "Nothing new — tasks already exist");
  });
};
function taskModal(id){
  const t = id ? S.tasks.find(x=>x.id===id) : {title:"", datetime:servingDateTime().slice(0,16), kind:"custom", done:false, notes:""};
  openModal(`<h3>${id?"Edit task":"Add task"}</h3><div class="m-sub">Schedule prep, cooking and everything in between.</div>
    <div class="field"><label>Task</label><input id="t-title" value="${esc(t.title)}" placeholder="e.g. Turkey goes in the oven"></div>
    <div class="field"><label>Date &amp; time</label><input id="t-dt" type="datetime-local" value="${esc(t.datetime)}"></div>
    <div class="field"><label>Notes</label><input id="t-notes" value="${esc(t.notes||"")}" placeholder="Optional"></div>
    <div class="modal-actions"><button class="btn ghost" id="mCancel">Cancel</button><button class="btn primary" id="mSave">${ICONS.check} Save task</button></div>`);
  $("#mCancel").addEventListener("click",closeModal);
  $("#mSave").addEventListener("click",()=>{
    const title=$("#t-title").value.trim(); if(!title){toast("Name the task");return;}
    const obj={id:id||uid(), title, datetime:$("#t-dt").value||servingDateTime().slice(0,16), kind:"custom", done:t.done||false, notes:$("#t-notes").value.trim()};
    if(id){S.tasks[S.tasks.findIndex(x=>x.id===id)]=obj;}else S.tasks.push(obj);
    save();closeModal();render();toast("Task saved");
  });
}
</script>

      <div class="field-row">
        <div class="field"><label>Category</label><select id="e-cat">${BUDGET_CATS.map(c=>`<option>${c}</option>`).join("")}</select></div>
        <div class="field"><label>Amount ($)</label><input id="e-amt" type="number" step="0.01" min="0" placeholder="0.00"></div>
      </div>
      <div class="modal-actions"><button class="btn ghost" id="mCancel">Cancel</button><button class="btn primary" id="mSave">${ICONS.check} Add expense</button></div>`);
    $("#mCancel").addEventListener("click",closeModal);
    $("#mSave").addEventListener("click",()=>{
      const desc=$("#e-desc").value.trim(), amt=+$("#e-amt").value||0;
      if(!desc||!amt){toast("Add a description and amount");return;}
      S.expenses.push({id:uid(), desc, cat:$("#e-cat").value, amount:amt});
      save();closeModal();render();toast("Expense added");

  $$("[data-del-e]",el).forEach(b=>b.addEventListener("click",()=>{
    S.expenses=S.expenses.filter(e=>e.id!==b.dataset.delE); save(); render(); toast("Expense removed");

  $("#editBudget").addEventListener("click",()=>{
    openModal(`<h3>Holiday budget</h3><div class="m-sub">Your total planned spend.</div>
      <div class="field"><label>Total budget ($)</label><input id="b-total" type="number" step="1" min="0" value="${esc(S.settings.budgetTotal)}"></div>
      <div class="modal-actions"><button class="btn ghost" id="mCancel">Cancel</button><button class="btn primary" id="mSave">${ICONS.check} Save</button></div>`);
    $("#mCancel").addEventListener("click",closeModal);

<!-- ===== LEDGERLOOPSTUDIO DEMO ENTRY LIMIT (15) ===== -->
<script>
(function(){
  var DEMO_LIMIT = 15;
  var DEMO_MSG = "Demo limit reached (15 entries). Get the full version on Etsy for unlimited entries!";
  var demoArrays = new WeakSet();
  var initialLens = new WeakMap();

  function registerDB(){
    try {
      var db = (typeof DB !== 'undefined' && DB) ? DB : null;
      if (!db || typeof db !== 'object') return;
      Object.keys(db).forEach(function(k){
        try {
          var v = db[k];
          if (Array.isArray(v) && !demoArrays.has(v)) {
            demoArrays.add(v);
            initialLens.set(v, v.length);
          }
        } catch(e){}
      });
    } catch(e){}
  }

  function checkLimit(arr, addCount){
    if (!demoArrays.has(arr)) return true;
    var initial = initialLens.get(arr) || 0;
    var userAdded = arr.length - initial;
    if (userAdded + addCount > DEMO_LIMIT) {
      try {
        if (typeof toast === 'function') toast(DEMO_MSG);
        else alert(DEMO_MSG);
      } catch(e){ alert(DEMO_MSG); }
      return false;
    }
    return true;
  }

  var _push = Array.prototype.push;
  Array.prototype.push = function(){
    if (demoArrays.has(this) && !checkLimit(this, arguments.length)) return this.length;
    return _push.apply(this, arguments);
  };
  var _unshift = Array.prototype.unshift;
  Array.prototype.unshift = function(){
    if (demoArrays.has(this) && !checkLimit(this, arguments.length)) return this.length;
    return _unshift.apply(this, arguments);
  };
  var _splice = Array.prototype.splice;
  Array.prototype.splice = function(start, deleteCount){
    var items = Array.prototype.slice.call(arguments, 2);
    if (demoArrays.has(this) && items.length && !checkLimit(this, items.length)) return [];
    return _splice.apply(this, arguments);
  };

  function boot(){
    registerDB();
    // Re-register periodically to catch DB reassignments (reset/load)
    setInterval(registerDB, 2500);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function(){ setTimeout(boot, 400); });
  } else {
    setTimeout(boot, 400);
  }
})();
</script>
